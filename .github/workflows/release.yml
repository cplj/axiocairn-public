name: Publish Python package
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -c "import os,tomllib; p=tomllib.load(open('pyproject.toml','rb')); assert os.getenv('RELEASE_TAG') == 'v'+p['project']['version']"
      - name: Build wheel without dependencies
        run: python -c "from pathlib import Path; import _build; Path('dist').mkdir(); _build.build_wheel('dist')"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
